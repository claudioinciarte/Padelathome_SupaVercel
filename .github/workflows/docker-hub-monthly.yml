name: Docker Hub - Rebuild mensual

# Reconstruye y publica la imagen de Docker Hub una vez al mes
# (y manualmente cuando se necesite) con el código de main al día.
# Vercel se despliega solo en cada push; este workflow mantiene
# la imagen de Docker al mismo nivel una vez al mes.

on:
  schedule:
    # 1º de cada mes a las 03:00 UTC
    - cron: '0 3 1 * *'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout código"
        uses: actions/checkout@v4

      - name: "Setup QEMU (multi-arch)"
        uses: docker/setup-qemu-action@v3

      - name: "Setup Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Login Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Build y push multi-arch (amd64 + arm64)"
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            pocholin/padelathome:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
